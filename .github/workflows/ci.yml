name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --check
      - run: cargo clippy --release --locked -- -D warnings
      - run: cargo build --release --locked
      - name: Scenarios
        shell: bash
        run: LOCK="$PWD/target/release/lock" bash tests/scenarios.sh
