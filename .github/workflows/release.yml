name: Release

# Builds lock for each platform when a version tag is pushed and attaches the
# archives to a GitHub release. install.sh, install.ps1 and action.yml download them.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: windows-latest, target: aarch64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install the target
        shell: bash
        run: |
          rustup target add ${{ matrix.target }}
          if [[ "${{ matrix.target }}" == *musl ]]; then sudo apt-get update && sudo apt-get install -y musl-tools; fi
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            7z a "$GITHUB_WORKSPACE/lock-${{ matrix.target }}.zip" lock.exe
          else
            tar -czf "$GITHUB_WORKSPACE/lock-${{ matrix.target }}.tar.gz" lock
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: lock-${{ matrix.target }}
          path: lock-${{ matrix.target }}.*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" lock-* --repo "${{ github.repository }}" --title "${{ github.ref_name }}" --generate-notes
