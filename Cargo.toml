[package]
name = "lock-hook"
version = "0.3.2"
edition = "2024"
# Let chains need 1.88.
rust-version = "1.88"
description = "Lock regions of a repository so coding agents cannot change them without a person's approval."
license = "MIT"
repository = "https://github.com/dariodaddamio/lock"
readme = "README.md"
homepage = "https://github.com/dariodaddamio/lock"
exclude = ["docs/", ".github/", "tests/"]
keywords = ["agents", "claude-code", "cursor", "git-hooks", "code-review"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "lock"
path = "src/main.rs"

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"

[profile.release]
lto = true
codegen-units = 1
strip = true
